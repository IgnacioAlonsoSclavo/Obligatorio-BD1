{% extends "base.html" %}

{% block content %}
<div class="mb-3">
    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-sm">&larr; Volver al Menú Principal</a>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="box">
            <h3 class="mb-1 text-center fw-bold">Inicio de Sesión</h3>
            <p class="text-muted text-center small mb-4">Ingrese sus credenciales de la UCU</p>

            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Correo Electrónico</label>
                    <input type="email" name="correo" class="form-control" placeholder="ejemplo@correo.ucu.edu.uy" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Contraseña</label>
                    <input type="password" name="contrasenia" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Entrar al Sistema</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
