{% extends "base.html" %}

{% block content %}
<div class="mb-3 d-flex justify-content-between align-items-center">
    <a href="{{ url_for('admin_panel') }}" class="btn btn-outline-secondary btn-sm">&larr; Volver al Panel de Administrador</a>
    <span class="badge bg-secondary">Usuarios</span>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="box">
            <h3 class="fw-bold mb-2 text-center">Registrar Nuevo Usuario</h3>
            <p class="text-muted small text-center mb-4">Crea una cuenta para un nuevo Administrador o Planillero</p>

            <form method="POST" action="{{ url_for('admin_crear_usuario') }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Correo Institucional UCU</label>
                    <input type="email" name="correo" class="form-control" placeholder="usuario@correo.ucu.edu.uy" required>
                    <small class="text-muted">Debe contener @ucu.edu.uy</small>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Contraseña</label>
                    <input type="password" name="contrasenia" class="form-control" placeholder="Mínimo 4 caracteres" required minlength="4">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Rol Asignado</label>
                    <select name="rol" class="form-select" required>
                        <option value="planillero">Planillero (Carga actas y resultados)</option>
                        <option value="admin">Administrador (Control total del torneo)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Crear Usuario</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
